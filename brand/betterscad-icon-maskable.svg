<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" role="img" aria-label="BetterSCAD">
  <title>BetterSCAD</title>
  <defs>
    <radialGradient id="bs-cavity" cx="0.72" cy="0.78" r="0.95">
      <stop offset="0" stop-color="#2AA7C4"/>
      <stop offset="0.55" stop-color="#12718A"/>
      <stop offset="1" stop-color="#083C4C"/>
    </radialGradient>
    <clipPath id="bs-body">
      <path d="M 64 12 L 109.03 38 L 109.03 90 L 64 116 L 18.97 90 L 18.97 38 Z"/>
    </clipPath>
    <mask id="bs-cut">
      <rect x="0" y="0" width="128" height="128" fill="#fff"/>
      <circle cx="64" cy="84" r="21" fill="#000"/>
    </mask>
  </defs>

  <rect width="192" height="192" fill="#111A24"/>
  <!-- 80% safe zone: the mark occupies the inner 60% so any mask shape fits. -->
  <g transform="translate(38.4 38.4) scale(0.9)">
    <g clip-path="url(#bs-body)">
      <circle cx="64" cy="84" r="21" fill="url(#bs-cavity)"/>
      <path d="M 45.5 74 A 21 21 0 0 1 82.5 74" fill="none" stroke="#5FE3F7" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
      <g mask="url(#bs-cut)">
        <path d="M 64 12 L 109.03 38 L 64 64 L 18.97 38 Z" fill="#FFC46B"/>
        <path d="M 18.97 38 L 64 64 L 64 116 L 18.97 90 Z" fill="#E8862A"/>
        <path d="M 109.03 38 L 64 64 L 64 116 L 109.03 90 Z" fill="#BE5A10"/>
      </g>
    </g>
  </g>
</svg>
