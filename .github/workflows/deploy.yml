name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing to a branch needs only `contents: write`, which the default
# GITHUB_TOKEN has. The `actions/deploy-pages` route needs Pages to have been
# switched on by hand first — `configure-pages` cannot create the site, because
# the default token has no admin rights — so this publishes to `gh-pages`
# instead and works on a fresh clone of the repo with no setup at all.
permissions:
  contents: write

# Let an in-progress deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Branch-based Pages runs the site through Jekyll unless told not to.
      - run: touch packages/app/dist/.nojekyll

      - name: Publish to gh-pages
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Build the commit with plumbing against a scratch index, so the
          # checkout and its real index are never touched.
          export GIT_INDEX_FILE="$RUNNER_TEMP/gh-pages.index"
          git --work-tree=packages/app/dist add -A
          tree=$(git write-tree)
          unset GIT_INDEX_FILE

          # A root commit each time: the branch only ever needs to hold the
          # current site, and keeping history would grow the repo by a full
          # copy of the bundle on every push.
          commit=$(git commit-tree "$tree" -m "Deploy ${GITHUB_SHA:0:7}")
          git push -f origin "${commit}:refs/heads/gh-pages"

          echo "Published ${GITHUB_SHA:0:7} to gh-pages" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
