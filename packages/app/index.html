<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BetterSCAD</title>
    <meta name="description" content="Local-first parametric CAD in the browser, fully compatible with OpenSCAD." />
    <meta name="theme-color" content="#0e0c0b" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./src/styles/index.css" />
  </head>
  <body>
    <!-- Replaced by the app on boot; visible while the WASM kernel loads. -->
    <div id="boot" class="boot">
      <img src="./betterscad-mark.svg" alt="" width="72" height="72" class="boot__mark" />
      <p class="boot__text">Starting the geometry kernel…</p>
      <noscript>BetterSCAD needs JavaScript. It runs entirely in your browser — nothing is uploaded.</noscript>
    </div>
    <div id="app" class="app" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
