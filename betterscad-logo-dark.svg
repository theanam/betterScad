<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 128" width="460" height="128" role="img" aria-label="BetterSCAD — code it, see it, print it">
  <title>BetterSCAD</title>
  <g>
    <path d="M 64 12 L 109.03 38 L 64 64 L 18.97 38 Z" fill="#efa84e"/>
    <path d="M 18.97 38 L 64 64 L 64 116 L 18.97 90 Z" fill="#d9883c"/>
    <path d="M 109.03 38 L 64 64 L 64 116 L 109.03 90 Z" fill="#b4682e"/>
  </g>
  <circle cx="57" cy="33" r="9.5" fill="#171310"/>

  <!-- The wordmark is one weight and one colour. An accent on `SCAD` would
       spend the amber on decoration, and amber is reserved for state. -->
  <text x="132" y="66" font-size="42" font-weight="700" letter-spacing="-1"
        font-family="'Inter', 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        fill="#ede8e2">BetterSCAD</text>
  <text x="134" y="94" font-size="12.5" font-weight="500" letter-spacing="3.1"
        font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace"
        fill="#9a8f86">CODE IT. SEE IT. PRINT IT.</text>
</svg>
